#spring.application.name=chord

spring:
  application:
    name:chord
  datasource:
    url: jdbc:mysql://localhost:3306/audio_db?useSSL=false&serverTimezone=UTC
    username: root
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  druid:
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false
    filters: stat,wall
    web-stat-filter:
      enabled: true
    stat-view-servlet:
      enabled: true
    url-pattern: /druid/*
    login-username: admin
    login-password: admin
